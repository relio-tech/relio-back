
name: Build and Push Docker Image

on:
  push:
    branches: [feature/stg]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.REGISTRY_DOMAIN }}/${{ vars.HARBOR_USER }}/${{ github.event.repository.name }}

jobs:
  build-push:
    runs-on: [self-hosted, luftjok]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch build envs
        run: |
          curl -sf -X POST "https://${{ vars.ENVS_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.ENVS_TOKEN }}" \
            -d '{"repo":"${{ github.event.repository.name }}"}' > .env || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_DOMAIN }}
          username: ${{ vars.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=local,src=/tmp/docker-cache/${{ github.repository }}
          cache-to: type=local,dest=/tmp/docker-cache/${{ github.repository }},mode=max
