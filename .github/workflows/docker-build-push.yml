
name: Build and Push Docker Image

on:
  push:
    branches: [feature/stg]
  workflow_dispatch:

env:
  IMAGE: registry.hackaton.es/${{ vars.HARBOR_USER }}/${{ github.event.repository.name }}

jobs:
  build-push:
    runs-on: [self-hosted, luftjok]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: registry.hackaton.es
          username: ${{ vars.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=local,src=/tmp/docker-cache/${{ github.repository }}
          cache-to: type=local,dest=/tmp/docker-cache/${{ github.repository }},mode=max
